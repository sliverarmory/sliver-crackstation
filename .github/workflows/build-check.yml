name: Build Check
on:
  push:
    branches: main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yml"
      - "Makefile"
      - "util/assets/**"

  pull_request:
    branches: main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yml"
      - "Makefile"
      - "util/assets/**"

jobs:
  build-linux-windows:
    name: Build Linux & Windows
    runs-on: "ubuntu-latest"

    steps:
      - name: Check Out Code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Git Fetch Tags
        run: git fetch --prune --unshallow --tags -f

      - name: Make
        working-directory: .
        run: |
          make assets
          go test -mod=vendor ./...
          make linux
          make windows

  build-macos:
    name: Build MacOS
    runs-on: "macos-latest"

    steps:
      - name: Check Out Code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Git Fetch Tags
        run: git fetch --prune --unshallow --tags -f

      - name: Make
        working-directory: .
        run: |
          make assets
          make macos-arm64
