name: Build Check
on:
  push:
    branches: main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yml"
      - "Makefile"
      - "util/assets/**"

  pull_request:
    branches: main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yml"
      - "Makefile"
      - "util/assets/**"

jobs:
  build-linux-windows:
    name: Build Linux & Windows
    runs-on: "ubuntu-latest"

    steps:
      - name: Check Out Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Git Fetch Tags
        run: git fetch --prune --unshallow --tags -f

      - name: Make
        working-directory: .
        run: |
          make assets
          go test -mod=vendor ./...
          make linux
          make windows

  build-macos:
    name: Build MacOS
    runs-on: "macos-latest"

    steps:
      - name: Check Out Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Git Fetch Tags
        run: git fetch --prune --unshallow --tags -f

      - name: Make
        working-directory: .
        run: |
          make assets
          make macos-arm64

  test-windows-hashcat:
    name: Test Embedded Windows Hashcat
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check Out Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fetch and verify embedded Hashcat archives
        run: go run -mod=vendor ./util/assets

      - name: Test embedded Windows Hashcat
        run: go test -mod=vendor ./pkg/hashcat -run '^TestEmbeddedWindowsHashcatPackage$' -count=1 -v
